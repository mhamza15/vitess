services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: main
    volumes:
      - ./tablet/extra_my.cnf:/etc/mysql/conf.d/bench-tuning.cnf:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "1g"
    networks:
      - bench

networks:
  bench:
    name: ${BENCH_NETWORK}
    external: true
