services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - etcd
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "1g"
    networks:
      - bench
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 12

  vtctld:
    image: vitess-bench:latest
    command: /vt/entrypoints/vtctld.sh
    volumes:
      - ./vtctld/entrypoint.sh:/vt/entrypoints/vtctld.sh:ro
    depends_on:
      etcd:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "1g"
    networks:
      - bench
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:15000/debug/health"]
      interval: 5s
      timeout: 5s
      retries: 24

  mysql-1001:
    image: vitess-bench:latest
    command: /vt/entrypoints/mysql.sh
    volumes:
      - ./mysql/entrypoint.sh:/vt/entrypoints/mysql.sh:ro
      - ./tablet/extra_my.cnf:/vt/config/extra_my.cnf:ro
    environment:
      TABLET_ID: "1001"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "1g"
    security_opt:
      - apparmor=unconfined
    networks:
      - bench
    healthcheck:
      test: ["CMD-SHELL", "test -S /vt/vtdataroot/vt_0000001001/mysql.sock"]
      interval: 5s
      timeout: 5s
      retries: 60

  tablet-1001:
    image: vitess-bench:latest
    command: /vt/entrypoints/tablet.sh
    volumes:
      - ./tablet/entrypoint.sh:/vt/entrypoints/tablet.sh:ro
    volumes_from:
      - mysql-1001
    environment:
      TABLET_ID: "1001"
      SHARD: "${SHARD_1001}"
      VTTABLET_EXTRA_FLAGS: "${VTTABLET_EXTRA_FLAGS:-}"
      GOGC: "200"

    depends_on:
      mysql-1001:
        condition: service_healthy
      vtctld:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "1g"
    networks:
      - bench
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:15100/debug/vars"]
      interval: 5s
      timeout: 5s
      retries: 60

  vtgate:
    image: vitess-bench:latest
    command: /vt/entrypoints/vtgate.sh
    volumes:
      - ./vtgate/entrypoint.sh:/vt/entrypoints/vtgate.sh:ro
    environment:
      VTGATE_WORKLOAD_MODE: "${VTGATE_WORKLOAD_MODE:-}"
      VTGATE_MAX_MEMORY_ROWS: "${VTGATE_MAX_MEMORY_ROWS:-}"
      GOGC: "200"

    depends_on:
      vtctld-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "1g"
    networks:
      - bench
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:15001/debug/health"]
      interval: 5s
      timeout: 5s
      retries: 24

  vtctld-init:
    image: vitess-bench:latest
    command: /vt/entrypoints/vtctld-init.sh
    volumes:
      - ./vtctld-init/entrypoint.sh:/vt/entrypoints/vtctld-init.sh:ro
      - ./vschema:/vt/vschema:ro
    environment:
      VSCHEMA_FILE: "${VSCHEMA_FILE}"
      SHARDS: "${SHARDS}"
    depends_on:
      vtctld:
        condition: service_healthy
      tablet-1001:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: "1g"
    networks:
      - bench

  pyroscope:
    build:
      context: .
      dockerfile: pyroscope.Dockerfile
    volumes:
      - ./runs:/vt/runs
    deploy:
      resources:
        limits:
          memory: "1g"
    networks:
      - bench

  alloy:
    image: grafana/alloy:latest
    entrypoint:
      - sh
      - /etc/alloy/entrypoint.sh
    volumes:
      - ./alloy/entrypoint.sh:/etc/alloy/entrypoint.sh:ro
    environment:
      SHARDS: "${SHARDS}"
      PROFILE_ENABLED: "${PROFILE_ENABLED:-false}"
    depends_on:
      pyroscope:
        condition: service_started
      vtgate:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: "1g"
    networks:
      - bench

  sysbench:
    image: sysbench-bench:latest
    volumes:
      - ./runs:/vt/runs
    environment:
      WORKLOAD: "${WORKLOAD}"
      TABLES: "${TABLES}"
      TABLE_SIZE: "${TABLE_SIZE:-}"
      SCALE: "${SCALE:-}"
      THREADS: "${THREADS}"
      EXTRA: "${EXTRA:-}"
      WARMUP_TIME: "${WARMUP_TIME}"
      RUN_TIME: "${RUN_TIME}"
      WORKING_DIR: "${WORKING_DIR:-}"
      RUN_SUBDIR: "${RUN_SUBDIR:-}"
    depends_on:
      vtgate:
        condition: service_healthy
      alloy:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: "1g"
    profiles:
      - bench
    networks:
      - bench

networks:
  bench:
    name: ${BENCH_NETWORK}
    external: true
