name: Compare Session Test Times

on:
  workflow_dispatch:
  pull_request:

permissions: read-all

jobs:
  old-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/tune-os

      - name: Setup MySQL
        uses: ./.github/actions/setup-mysql
        with:
          flavor: mysql-8.4

      - name: Get dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make unzip g++ etcd-client etcd-server curl git wget xz-utils libncurses6
          sudo service etcd stop
          go mod download

      - name: Build
        run: NOVTADMINBUILD=true make build minimaltools

      - name: Old test
        run: |
          # VTDATAROOT must be short to keep MySQL socket path under 107 chars
          export VTDATAROOT="/tmp/"
          source build.env
          time go test -count=1 -run 'TestSessionMode' ./go/test/endtoend/vtgate/tabletbalancer/session_old/...

  new-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Vitess binaries
        run: |
          NOVTADMINBUILD=1 make install PREFIX=.vitesst_install

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Vitesst mysql80 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: go/test/vitesst/Dockerfile.mysql80
          tags: vitesst:mysql80
          load: true
          cache-from: type=gha,scope=vitesst-mysql80
          cache-to: type=gha,mode=max,scope=vitesst-mysql80

      - name: Build Vitesst mysql84 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: go/test/vitesst/Dockerfile.mysql84
          tags: vitesst:mysql84
          load: true
          cache-from: type=gha,scope=vitesst-mysql84
          cache-to: type=gha,mode=max,scope=vitesst-mysql84

      - name: New test
        run: |
          export VTDATAROOT="/tmp/"
          source build.env
          time go test -count=1 -run 'TestSessionMode' ./go/test/endtoend/vtgate/tabletbalancer/session/...
