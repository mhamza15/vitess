name: Compare Session Test Times

on:
  workflow_dispatch:
  pull_request:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Old test
        run: time go test -count=1 -run 'TestSessionMode' ./go/test/endtoend/vtgate/tabletbalancer/session_old/...

      - name: New test
        run: time go test -count=1 -run 'TestSessionMode' ./go/test/endtoend/vtgate/tabletbalancer/session/...
