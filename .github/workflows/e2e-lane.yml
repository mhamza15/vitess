name: e2e lane

on:
  workflow_call:
    inputs:
      race:
        description: Build race-instrumented images and run tests with the race detector.
        required: true
        type: boolean

env:
  EXCLUDE_PACKAGES: |
    vitess.io/vitess/go/test/endtoend/binlogdump
    vitess.io/vitess/go/test/endtoend/transaction/twopc/fuzz
    vitess.io/vitess/go/test/endtoend/docker
    vitess.io/vitess/go/test/endtoend/vtcombo
    vitess.io/vitess/go/test/endtoend/vtcombo/recreate
    vitess.io/vitess/go/test/endtoend/utils
    vitess.io/vitess/go/test/endtoend/transaction/twopc
    vitess.io/vitess/go/test/endtoend/transaction/twopc/metric

  PARTITIONS: 64

jobs:
  build-images:
    name: Build images
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: "false"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push images
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: go/vitesst/docker-bake.hcl
          push: true
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha,scope=vitesst${{ inputs.race && '-race' || '' }}
            *.cache-to=type=gha,mode=max,scope=vitesst${{ inputs.race && '-race' || '' }}
            *.args.RACE=${{ inputs.race && '1' || '' }}
            mysql80.tags=ghcr.io/${{ github.repository }}/vitesst:mysql80-${{ github.sha }}${{ inputs.race && '-race' || '' }}
            mysql84.tags=ghcr.io/${{ github.repository }}/vitesst:mysql84-${{ github.sha }}${{ inputs.race && '-race' || '' }}
            mariadb.tags=ghcr.io/${{ github.repository }}/vitesst:mariadb-${{ github.sha }}${{ inputs.race && '-race' || '' }}

  generate-matrix:
    name: Generate shard matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      actions: read

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: "false"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          go-version-file: go.mod

      - name: Download timing data from the latest run
        env:
          GH_TOKEN: ${{ github.token }}

        # Prefer the current branch's latest successful run, falling back to
        # main's.
        run: |
          # On pull request events the ref name is the merge ref, so use the
          # head branch there.
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "timing source branch: $branch"

          # Completed rather than success for now: partially failed runs still
          # upload timings from their green shards, and no run is fully green
          # yet.
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow e2e.yaml --branch "$branch" \
            --status completed --limit 1 --json databaseId -q '.[0].databaseId' || true)

          if [[ -z "$run_id" ]]; then
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow e2e.yaml --branch main \
              --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
          fi

          if [[ -n "$run_id" ]]; then
            echo "downloading timing artifacts from run $run_id"
            gh run download --repo "$GITHUB_REPOSITORY" "$run_id" --pattern 'e2e-timing-*' --dir timing \
              || echo "timing artifact download failed"
          else
            echo "no prior run with timing artifacts found"
          fi

      - name: Generate shard matrix
        id: matrix
        env:
          RACE: ${{ inputs.race }}

        run: |
          set -o pipefail
          pkgs=$(go list ./go/test/endtoend/... | grep -vFx -f <(printf '%s' "$EXCLUDE_PACKAGES"))

          # Seed timings bootstrap packages whose shards have never survived
          # long enough to upload real ones.
          mkdir -p timing/seed
          cp .github/e2e-timing-seed.log timing/seed/

          matrix=$(printf '%s\n' "$pkgs" \
            | go run ./go/tools/e2ematrix -partitions "$PARTITIONS" -timing-dir timing)

          suffix=''
          if [[ "$RACE" == "true" ]]; then
            suffix='-race'
          fi

          echo "matrix=$(jq -c --arg suffix "$suffix" '.include |= map(
            (.packages | split(" ") | map(sub("^vitess.io/vitess/go/test/endtoend/"; "")) | join(", ")) as $pkgs
            | . + {id: "\(.id)\($suffix)",
                   description: "Shard \((.id | tonumber) + 1) - \($pkgs)\(if .slice then " [slice \(.slice)]" else "" end)"}
          )' <<<"$matrix")" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.description }}
    needs: [build-images, generate-matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 110

    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: "false"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          go-version-file: go.mod

      - name: Log in to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull images
        env:
          RACE: ${{ inputs.race }}

        run: |
          suffix=''
          if [[ "$RACE" == "true" ]]; then
            suffix='-race'
          fi

          repo="ghcr.io/${GITHUB_REPOSITORY@L}/vitesst"
          for flavor in mysql80 mysql84 mariadb; do
            docker pull -q "$repo:$flavor-$GITHUB_SHA$suffix"
            docker tag "$repo:$flavor-$GITHUB_SHA$suffix" "vitesst:$flavor"
          done

      - name: Run tests
        env:
          PKG: ${{ matrix.packages }}
          RACE: ${{ inputs.race }}
          RUN_FLAGS: ${{ matrix.runFlags }}

        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          GOTEST_FLAGS="-json -artifacts -outputdir $GITHUB_WORKSPACE/artifacts"
          if [[ "$RACE" == "true" ]]; then
            GOTEST_FLAGS+=' -race'
          fi
          if [[ -n "$RUN_FLAGS" ]]; then
            # Escape $ anchors so make does not expand them as variables.
            GOTEST_FLAGS+=" ${RUN_FLAGS//$/\$\$}"
          fi

          make -s NOBANNER=1 e2e SKIP_IMAGE_BUILD=1 PKG="$PKG" GOTEST_FLAGS="$GOTEST_FLAGS" \
            | go tool -modfile=tools/gotestsum/go.mod gotestsum \
                --raw-command --format github-actions --jsonfile timing.log -- cat

      - name: Upload timing data
        # Also upload from failed shards: passing tests in them still produce
        # real durations, keeping the partitioner's unknown set small.
        if: ${{ !cancelled() && !inputs.race }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-timing-${{ matrix.id }}
          path: timing.log
          retention-days: 7

      - name: Keep only failed test artifacts
        if: failure()
        run: |
          keep=$(jq -rs '
            def key: .Package + "/" + .Test;
            map(select(.Test != null)) as $tests
            | ($tests | map(select(.Action == "run") | key)) as $started
            | ($tests | map(select(.Action == "pass" or .Action == "skip") | key)) as $done
            | ($started - $done) as $keep
            | $tests[]
            | select(.Action == "artifacts" and (key as $k | $keep | index($k)))
            | .Path + "\t" + (key | gsub("[^A-Za-z0-9._-]+"; "_"))
          ' timing.log) || exit 0

          [[ -n "$keep" ]] || exit 0

          mkdir -p failed-artifacts
          while IFS=$'\t' read -r path name; do
            if [[ -d "$path" ]]; then
              mv "$path" "failed-artifacts/$name"
            fi
          done <<<"$keep"

          if [[ -n "$(ls -A failed-artifacts)" ]]; then
            rm -rf artifacts/_artifacts
            mv failed-artifacts artifacts/_artifacts
          fi

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-${{ matrix.id }}
          path: artifacts
          retention-days: 7
