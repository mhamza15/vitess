name: Cluster E2E Tests

on:
  push:
    branches:
      - main
      - "release-[0-9]+.[0-9]"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  PARTITIONS: 32
  TIMING_RUNS_TO_KEEP: 3

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.changes.outputs.end_to_end }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            end_to_end:
              - 'go/**/*.go'
              - 'go/vt/sidecardb/**/*.sql'
              - 'test/**'
              - 'Makefile'
              - 'build.env'
              - 'go.mod'
              - 'go.sum'
              - 'proto/*.proto'
              - 'tools/**'
              - 'config/**'
              - 'bootstrap.sh'

  matrix:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      
      - name: Restore timing cache
        uses: actions/cache/restore@v5
        with:
          path: timing-data/
          key: test-timing-
          restore-keys: test-timing-

      - name: Generate test matrix
        id: generate
        run: |
          if ls timing-data/*/*.json 1>/dev/null 2>&1; then
            echo "Using cached timing data:"
            ls -la timing-data/*/
            TIMING_FILES="timing-data/*/*.json"
          else
            echo "No timing data found, using empty timing"
            echo '{}' > empty-timing.json
            TIMING_FILES="empty-timing.json"
          fi
          
          # Get list of packages to test, filtering out excludes
          PACKAGES=$(go list ./go/test/endtoend/...)
          EXCLUDES=$(yq -r '.excludes // [] | .[]' test/config.yaml 2>/dev/null | paste -sd '|' -)
          if [ -n "$EXCLUDES" ]; then
            echo "Excluding packages: $EXCLUDES"
            PACKAGES=$(echo "$PACKAGES" | grep -Ev "$EXCLUDES")
          fi
          
          echo "$PACKAGES" | go tool gotestsum tool ci-matrix --timing-files $TIMING_FILES --partitions $PARTITIONS > matrix.json
          
          # Convert 0-indexed id to 1-indexed shard number
          jq '.include |= map(.shard = .id + 1)' matrix.json | tee matrix-final.json
          echo "matrix=$(jq -c . matrix-final.json)" >> $GITHUB_OUTPUT

  test:
    name: Shard ${{ matrix.shard }}
    needs: [changes, matrix]
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      VTDATAROOT: /tmp/
    
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/tune-os

      - name: Determine dependencies
        id: deps
        run: |
          deps=""
          for pkg in ${{ matrix.packages }}; do
            pkg_deps=$(yq -r ".deps.\"$pkg\" // [] | .[]" test/config.yaml 2>/dev/null)
            deps="$deps $pkg_deps"
          done
          deps=$(echo $deps | tr ' ' '\n' | sort -u | xargs)
          echo "deps=$deps" >> $GITHUB_OUTPUT

      - name: Print test plan
        run: |
          echo "## Packages to test"
          for pkg in ${{ matrix.packages }}; do
            echo "  - $pkg"
          done
          echo ""
          echo "## Dependencies by package"
          for pkg in ${{ matrix.packages }}; do
            pkg_deps=$(yq -r ".deps.\"$pkg\" // [] | .[]" test/config.yaml 2>/dev/null)
            if [ -n "$pkg_deps" ]; then
              echo "  $pkg:"
              for dep in $pkg_deps; do
                echo "    - $dep"
              done
            fi
          done
          echo ""
          echo "## Dependencies to install: ${{ steps.deps.outputs.deps }}"

      - name: Setup MySQL
        uses: ./.github/actions/setup-mysql
        with:
          flavor: mysql-8.4

      - name: Install XtraBackup
        if: contains(steps.deps.outputs.deps, 'xtrabackup')
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y lsb-release gnupg2
          wget https://repo.percona.com/apt/percona-release_latest.$(lsb_release -sc)_all.deb
          sudo DEBIAN_FRONTEND="noninteractive" dpkg -i percona-release_latest.$(lsb_release -sc)_all.deb
          sudo percona-release enable pxb-84-lts
          sudo apt-get -qq update
          sudo apt-get -qq install -y percona-xtrabackup-84 lz4

      - name: Install Consul/Zookeeper
        if: contains(steps.deps.outputs.deps, 'consul') || contains(steps.deps.outputs.deps, 'zookeeper')
        run: make tools

      - name: Install Minio
        if: contains(steps.deps.outputs.deps, 'minio')
        run: |
          wget https://dl.min.io/server/minio/release/linux-amd64/minio
          chmod +x minio
          sudo mv minio /usr/local/bin

      - name: Install base dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y make unzip g++ etcd-client etcd-server curl git wget mysql-shell
          sudo service etcd stop
          go mod download

      - name: Build
        run: NOVTADMINBUILD=1 make build

      - name: Run tests
        id: tests
        run: |
          source build.env
          go tool gotestsum \
            --format github-actions \
            --hide-summary=skipped \
            --junitfile report.xml \
            --jsonfile report.json \
            --rerun-fails=3 \
            --rerun-fails-max-failures=10 \
            --rerun-fails-run-root-test \
            --packages "${{ matrix.packages }}" \
            -- -timeout 45m -args -logtostderr

      - name: Slowest tests
        if: ${{ !cancelled() }}
        run: |
          slowest=$(go tool gotestsum tool slowest --jsonfile report.json --threshold 1m)
          if [ -n "$slowest" ]; then
            echo "## Slowest Tests" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$slowest" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Test Report
        if: failure() && steps.tests.outcome == 'failure'
        uses: dorny/test-reporter@v2
        with:
          name: Test Results (Shard ${{ matrix.shard }})
          path: report.json
          reporter: golang-json

      - name: Upload timing report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-report-${{ matrix.shard }}
          path: report.json
          retention-days: 1

  collect-timing:
    name: Collect Timing Data
    needs: [changes, test]
    if: needs.changes.outputs.should_run == 'true' && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Restore timing cache
        uses: actions/cache/restore@v5
        with:
          path: timing-data/
          key: test-timing-
          restore-keys: test-timing-

      - name: Download test reports
        uses: actions/download-artifact@v6
        with:
          pattern: test-report-*
          path: reports/

      - name: Collect timing data
        run: |
          mkdir -p timing-data/run-${{ github.run_number }}
          for dir in reports/test-report-*; do
            shard=$(basename "$dir" | sed 's/test-report-//')
            cp "$dir/report.json" "timing-data/run-${{ github.run_number }}/shard-${shard}.json"
          done
          
          # Keep only the last N runs
          cd timing-data
          ls -d run-* 2>/dev/null | sort -t- -k2 -n | head -n -$TIMING_RUNS_TO_KEEP | xargs -r rm -rf
          
          echo "Timing data after collection:"
          ls -la */

      - name: Save timing cache
        uses: actions/cache/save@v5
        with:
          path: timing-data/
          key: test-timing-${{ github.run_number }}
