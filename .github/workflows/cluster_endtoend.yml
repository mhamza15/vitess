name: Cluster E2E Tests

on:
  push:
    branches:
      - main
      - "release-[0-9]+.[0-9]"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  PARTITIONS: 16

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.changes.outputs.end_to_end }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            end_to_end:
              - 'go/**/*.go'
              - 'go/vt/sidecardb/**/*.sql'
              - 'test/**'
              - 'Makefile'
              - 'build.env'
              - 'go.mod'
              - 'go.sum'
              - 'proto/*.proto'
              - 'tools/**'
              - 'config/**'
              - 'bootstrap.sh'

  build:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: NOVTADMINBUILD=1 make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vitess-build
          path: bin/
          retention-days: 1

  matrix:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      
      - name: Generate test matrix
        id: generate
        run: |
          echo '{}' > empty-timing.json
          go list ./go/test/endtoend/... | go tool gotestsum tool ci-matrix --timing-files empty-timing.json --partitions $PARTITIONS > matrix.json
          echo "matrix=$(jq -c . matrix.json)" >> $GITHUB_OUTPUT

  test:
    name: Shard ${{ matrix.id + 1 }}
    needs: [changes, matrix, build]
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      VTDATAROOT: /tmp/
    
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/tune-os

      - name: Determine dependencies
        id: deps
        run: |
          deps=""
          for pkg in ${{ matrix.packages }}; do
            pkg_deps=$(yq -r ".\"$pkg\" // [] | .[]" test/deps.yaml 2>/dev/null)
            deps="$deps $pkg_deps"
          done
          deps=$(echo $deps | tr ' ' '\n' | sort -u | xargs)
          echo "deps=$deps" >> $GITHUB_OUTPUT

      - name: Setup MySQL
        if: ${{ !contains(steps.deps.outputs.deps, 'xtrabackup') }}
        uses: ./.github/actions/setup-mysql
        with:
          flavor: mysql-8.4

      - name: Install XtraBackup
        if: contains(steps.deps.outputs.deps, 'xtrabackup')
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y lsb-release gnupg2
          wget https://repo.percona.com/apt/percona-release_latest.$(lsb_release -sc)_all.deb
          sudo DEBIAN_FRONTEND="noninteractive" dpkg -i percona-release_latest.$(lsb_release -sc)_all.deb
          sudo percona-release setup ps80
          sudo apt-get -qq update
          sudo apt-get -qq install -y percona-server-server percona-server-client percona-xtrabackup-80 lz4
          sudo service mysql stop
          sudo ln -s /etc/apparmor.d/usr.sbin.mysqld /etc/apparmor.d/disable/
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld

      - name: Install Consul/Zookeeper
        if: contains(steps.deps.outputs.deps, 'consul') || contains(steps.deps.outputs.deps, 'zookeeper')
        run: make tools

      - name: Install Minio
        if: contains(steps.deps.outputs.deps, 'minio')
        run: |
          wget https://dl.min.io/server/minio/release/linux-amd64/minio
          chmod +x minio
          sudo mv minio /usr/local/bin

      - name: Install base dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y make unzip g++ etcd-client etcd-server curl git wget mysql-shell
          sudo service etcd stop
          go mod download

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: vitess-build
          path: bin/

      - name: Fix permissions
        run: chmod +x bin/*

      - name: Run tests
        run: |
          source build.env
          go tool gotestsum \
            --format github-actions \
            --junitfile report.xml \
            --rerun-fails=3 \
            --rerun-fails-max-failures=10 \
            --packages "${{ matrix.packages }}" \
            -- -v -timeout 45m

      - name: Test Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: report.xml
          show: fail
